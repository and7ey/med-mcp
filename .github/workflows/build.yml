name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mcpb:
    name: mcpb (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [emias-mcp, smartmed-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .mcpb
        run: bash scripts/build_mcpb.sh ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb-${{ matrix.project }}
          path: ${{ matrix.project }}/dist/*.mcpb
          if-no-files-found: error

  opencode:
    name: opencode (${{ matrix.project }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
        project: [emias-mcp, smartmed-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.project }}/requirements-mcp.txt" pyinstaller
      - name: Build binary
        shell: bash
        run: python scripts/build_opencode.py ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.project }}-${{ matrix.os }}
          path: |
            ${{ matrix.project }}/dist/opencode/*
            !${{ matrix.project }}/dist/opencode/.build/**
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mcpb, opencode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
