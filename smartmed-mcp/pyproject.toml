[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmed-mcp"
version = "0.2.0"
description = "MCP-сервер личного кабинета SmartMed (smartmed.pro), read-only"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2", "playwright>=1.48", "certifi>=2024.2"]

[tool.setuptools.packages.find]
include = ["smartmed*", "smartmed_mcp*"]
